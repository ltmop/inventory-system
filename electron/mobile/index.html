<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<title>AI 智能进销存</title>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}</script>
<style>
/* ============================================================
   设计系统：白 + 蓝 · 简约大气（2026-09-21 重做）
   · 颜色只有一套：白底、石板灰文字、一个主蓝（点缀用）
   · 圆角三级（22/16/12）+ 两级极浅阴影，不用粗黑描边
   · 动画全部走非线性缓动：--ease（先快后慢）/ --spring（轻微回弹）
   · 图标一律内联 SVG（.i），界面里不再出现 emoji
   · --s 是全局尺寸比例（更多页可切 小/标准/大），所有关键尺寸都乘它
   ============================================================ */
:root{
  --bg:#f5f7fb; --card:#ffffff; --card2:#fafbfe;
  --ink:#0f172a; --ink2:#334155; --sub:#7b8794;
  --line:#e9eef6; --line2:#f1f5f9;
  --blue:#2563eb; --blue-d:#1d4ed8; --blue-l:#eff6ff; --blue-l2:#dbeafe;
  --ok:#0f9d68; --ok-l:#e9f8f1; --warn:#c98a1c; --warn-l:#fdf5e6;
  --danger:#e5484d; --danger-l:#fdeeee;
  --r-xl:22px; --r-lg:16px; --r-md:12px; --r-sm:9px;
  --sh-1:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  --sh-2:0 12px 32px rgba(16,24,40,.10);
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.4,.64,1);
  --s:1; font-size:15px;
  /* 顶部安全区：安卓 15+ 强制全屏（edge-to-edge），不垫开就会被手机状态栏盖住标题。
     真机拿不到系统安全区时，app.js 会把它兜成常见状态栏高度。 */
  --safe-top:env(safe-area-inset-top,0px);
  color-scheme:light;
}
body.size-s{--s:.9}
body.size-l{--s:1.14}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);display:flex;justify-content:center;font-size:calc(var(--s)*15px);-webkit-font-smoothing:antialiased}
.phone{width:100%;max-width:430px;background:var(--bg);height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:var(--sh-2);padding-top:var(--safe-top,0px)}
/* 内联图标统一口径：跟文字同色、跟字号对齐 */
.i{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.22em;flex:none}
.ico-box{display:flex;align-items:center;justify-content:center}

/* ---------- 顶栏 ---------- */
.sign{flex:none;background:var(--card);padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.sign h1{font-size:calc(var(--s)*17px);font-weight:800;letter-spacing:.2px}
.sign .sub{font-size:calc(var(--s)*11px);color:var(--sub);margin-top:1px}
.seal{margin-left:auto;display:flex;align-items:center;gap:5px;background:var(--blue-l);color:var(--blue);border-radius:999px;padding:5px 11px;font-size:calc(var(--s)*11px);font-weight:800}
.seal .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);animation:breathe 2.6s var(--ease) infinite}
@keyframes breathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
#netBanner{flex:none}
#app{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;scroll-behavior:smooth}
#app>*{flex:0 0 auto;animation:pageIn .34s var(--ease) both}
/* 切页进场：轻微上移 + 淡入（非线性，先快后慢） */
@keyframes pageIn{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
#app.absorb{overflow:hidden}
#app.absorb>*{flex:1 1 auto;min-height:0}

/* ---------- 开单页：三区固定 ---------- */
.pos{display:flex;flex-direction:column;height:100%;min-height:0;background:var(--bg)}
.pos-top{flex:none;background:var(--card);border-bottom:1px solid var(--line);position:relative;z-index:3}
.pos-mid{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.pos-cart{flex:none;display:flex;flex-direction:column;background:var(--card);border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:0 -8px 28px rgba(16,24,40,.10);max-height:58%;transition:max-height .32s var(--ease)}
.pos-cart .chead{flex:none;display:flex;align-items:center;gap:8px;padding:14px 16px 10px;cursor:pointer}
.pos-cart .chead .t{display:flex;align-items:center;gap:7px;font-size:calc(var(--s)*14px);font-weight:800}
.pos-cart .chead .t .pill{background:var(--blue);color:#fff;border-radius:999px;min-width:18px;height:18px;padding:0 5px;font-size:calc(var(--s)*11px);font-weight:800;display:flex;align-items:center;justify-content:center}
.pos-cart .chead .sum{margin-left:auto;font-size:calc(var(--s)*17px);font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.pos-cart .chead .chev{display:flex;color:var(--sub);transition:transform .3s var(--spring)}
.pos-cart.collapsed .chead .chev{transform:rotate(-90deg)}
.pos-cart .chead .clr{display:flex;align-items:center;gap:3px;font-size:calc(var(--s)*11px);color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:3px 9px;background:#fff;font-weight:700}
.pos-cart .clist{overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;padding:0 16px}
.pos-cart.collapsed .clist{display:none}
.pos-cart .ctail{flex:none;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line2)}
.pos-cart .empty{color:var(--sub);font-size:calc(var(--s)*12.5px);text-align:center;padding:18px 8px;line-height:1.7}
.line{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line2);animation:lineIn .3s var(--spring) both}
@keyframes lineIn{from{opacity:0;transform:translate3d(16px,0,0)}to{opacity:1;transform:none}}
.line:last-child{border-bottom:none}
.line .del{flex:none;width:calc(var(--s)*30px);height:calc(var(--s)*30px);border-radius:50%;border:none;background:var(--danger-l);color:var(--danger);display:flex;align-items:center;justify-content:center}
.line .ph{width:calc(var(--s)*42px);height:calc(var(--s)*42px);border-radius:var(--r-md);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:calc(var(--s)*16px);font-weight:800}
.line .im{width:calc(var(--s)*42px);height:calc(var(--s)*42px);border-radius:var(--r-md);flex:none;object-fit:cover;background:var(--line2)}
.line .info{flex:1;min-width:0}
.line .info .n{font-size:calc(var(--s)*13.5px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line .info .p{font-size:calc(var(--s)*12px);color:var(--sub);display:flex;align-items:center;gap:6px;margin-top:2px}
.line .info .p .pb{display:inline-flex;align-items:center;gap:3px;color:var(--blue);font-weight:800;border-bottom:1px dashed var(--blue-l2);cursor:pointer}
.line .info .p .chg{background:var(--warn-l);color:var(--warn);border-radius:6px;padding:0 6px;font-size:calc(var(--s)*10px);font-weight:800}
.line .info .p .rs{display:inline-flex;align-items:center;gap:2px;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:0 5px;font-size:calc(var(--s)*10px);background:#fff;cursor:pointer}
.qty{display:flex;align-items:center;gap:4px;flex:none;background:var(--blue-l);border-radius:999px;padding:3px}
.qty button{width:calc(var(--s)*28px);height:calc(var(--s)*28px);border-radius:50%;border:none;background:#fff;color:var(--blue);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-1)}
.qty .n{min-width:calc(var(--s)*30px);text-align:center;font-size:calc(var(--s)*14px);font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.total .t{font-size:calc(var(--s)*13px);color:var(--sub);font-weight:600}
.total .v{font-size:calc(var(--s)*24px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px}

/* ---------- 找货区 ---------- */
.scanrow{display:flex;gap:8px;padding:10px 14px 4px}
.scanbtn{flex:none;height:calc(var(--s)*44px);padding:0 14px;border:none;border-radius:var(--r-md);background:var(--blue-l);color:var(--blue);font-size:calc(var(--s)*14px);font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}
.search{flex:1;min-width:0;height:calc(var(--s)*44px);border:1px solid var(--line);border-radius:var(--r-md);background:var(--card2);padding:0 12px;font-size:calc(var(--s)*14px);outline:none;color:var(--ink);transition:border-color .2s var(--ease),background .2s var(--ease),box-shadow .2s var(--ease)}
.search::placeholder{color:#a9b3c1}
.search:focus{border-color:var(--blue-l2);background:#fff;box-shadow:0 0 0 4px var(--blue-l)}
.cats{display:flex;gap:7px;overflow-x:auto;padding:9px 14px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;height:calc(var(--s)*32px);padding:0 13px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:calc(var(--s)*13px);font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:5px;white-space:nowrap;transition:background .22s var(--ease),color .22s var(--ease),border-color .22s var(--ease),transform .22s var(--spring)}
.cat:active{transform:scale(.95)}
.cat.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.24)}
.cat .n{font-size:calc(var(--s)*10px);opacity:.55;font-weight:800}
.cat.on .n{opacity:.8}
.hint{font-size:calc(var(--s)*11px);color:var(--sub);padding:4px 16px 0}
.sectitle{display:flex;align-items:center;gap:8px;padding:12px 16px 8px}
.sectitle .tag{background:var(--ink);color:#fff;font-size:calc(var(--s)*11.5px);font-weight:800;padding:4px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
.sectitle span{font-size:calc(var(--s)*11px);color:var(--sub)}
.sectitle .how{margin-left:auto;font-size:calc(var(--s)*11px);color:var(--sub)}

/* ---------- 商品卡 ---------- */
.grid,.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:0 12px 12px}
.pgrid>*,.grid>*{animation:cardIn .4s var(--ease) both;animation-delay:calc(var(--i,0) * 18ms)}
@keyframes cardIn{from{opacity:0;transform:translate3d(0,14px,0) scale(.97)}to{opacity:1;transform:none}}
.hot,.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;position:relative;user-select:none;box-shadow:var(--sh-1);transition:transform .22s var(--spring),box-shadow .22s var(--ease)}
.hot:active,.pcard:active{transform:scale(.96);box-shadow:0 2px 6px rgba(16,24,40,.06)}
.hot .ph,.pcard .ph{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:calc(var(--s)*28px);font-weight:800;color:#fff}
.hot .im,.pcard .im{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--line2)}
.hot .nm,.pcard .nm{font-size:calc(var(--s)*11.5px);font-weight:700;padding:5px 6px 0;line-height:1.28;min-height:calc(var(--s)*30px);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink)}
.hot .pr,.pcard .pr{font-size:calc(var(--s)*13px);font-weight:800;color:var(--ink);padding:1px 6px 6px;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;justify-content:space-between;gap:3px;white-space:nowrap}
.hot .pr .stk,.pcard .pr .stk{font-size:calc(var(--s)*10px);color:var(--sub);font-weight:600}
.hot .badge,.pcard .badge{position:absolute;top:4px;right:4px;min-width:20px;height:20px;border-radius:999px;background:var(--blue);color:#fff;font-size:calc(var(--s)*11px);font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 4px 10px rgba(37,99,235,.35);animation:pop .3s var(--spring) both}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.cam{position:absolute;left:5px;bottom:5px;width:calc(var(--s)*24px);height:calc(var(--s)*24px);border-radius:50%;background:rgba(255,255,255,.94);color:var(--blue);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-1);backdrop-filter:blur(4px)}
.cam:active{transform:scale(.88)}

/* ---------- 搜索结果行 ---------- */
.srow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px;margin:0 14px 8px;box-shadow:var(--sh-1);transition:transform .2s var(--spring),box-shadow .2s var(--ease);animation:cardIn .34s var(--ease) both;animation-delay:calc(var(--i,0) * 14ms)}
.srow:active{transform:scale(.985)}
.srow .ph{width:calc(var(--s)*44px);height:calc(var(--s)*44px);border-radius:var(--r-md);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:calc(var(--s)*17px);font-weight:800}
.srow .im{width:calc(var(--s)*44px);height:calc(var(--s)*44px);border-radius:var(--r-md);flex:none;object-fit:cover;background:var(--line2)}
.srow .info{flex:1;min-width:0}
.srow .n{font-size:calc(var(--s)*14px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .d{font-size:calc(var(--s)*11px);color:var(--sub);margin-top:2px}
.srow .pr{font-size:calc(var(--s)*15px);font-weight:800;flex:none;text-align:right;font-variant-numeric:tabular-nums}
.srow .cam2{flex:none;width:calc(var(--s)*32px);height:calc(var(--s)*32px);border-radius:50%;background:var(--blue-l);color:var(--blue);display:flex;align-items:center;justify-content:center}
mark{background:var(--blue-l2);color:var(--blue-d);border-radius:3px;padding:0 2px}

/* ---------- 收款四键 ---------- */
.payrow{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.pay{height:calc(var(--s)*48px);border:none;border-radius:var(--r-md);font-size:calc(var(--s)*14.5px);font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;gap:5px;letter-spacing:.5px;transition:transform .2s var(--spring),filter .2s var(--ease),box-shadow .2s var(--ease);box-shadow:0 6px 16px rgba(16,24,40,.16)}
.pay:active{transform:scale(.95);filter:brightness(.96)}
.pay.cash{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.pay.wx{background:linear-gradient(135deg,#22c55e,#0f9d68)}
.pay.ali{background:linear-gradient(135deg,#60a5fa,#1d4ed8)}
.pay.credit{background:linear-gradient(135deg,#64748b,#334155)}
.pay[disabled]{opacity:.45}

/* ---------- 底部导航 ---------- */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);flex:none;padding-bottom:env(safe-area-inset-bottom)}
.tab{padding:8px 0 7px;text-align:center;font-size:calc(var(--s)*11px);color:var(--sub);font-weight:700;cursor:pointer;text-decoration:none;position:relative;transition:color .22s var(--ease)}
.tab .ico-box{width:100%;display:flex;justify-content:center;margin-bottom:3px}
.tab svg{width:calc(var(--s)*21px);height:calc(var(--s)*21px);transition:transform .32s var(--spring)}
.tab.on{color:var(--blue)}
.tab.on svg{transform:translateY(-1px) scale(1.08)}
.tab.on::before{content:'';position:absolute;top:0;left:50%;width:22px;height:3px;border-radius:999px;background:var(--blue);transform:translateX(-50%);animation:tabIn .34s var(--spring) both}
@keyframes tabIn{from{width:0;opacity:0}to{width:22px;opacity:1}}

/* ---------- 卡片 / 列表 ---------- */
.card{background:var(--card);border-radius:var(--r-lg);padding:14px;margin:0 14px 10px;border:1px solid var(--line);box-shadow:var(--sh-1);transition:transform .2s var(--spring),box-shadow .2s var(--ease)}
.card.tap:active{transform:scale(.985)}
.card .split{display:flex;justify-content:space-between;align-items:center}
.list{background:var(--card);border-radius:var(--r-lg);border:1px solid var(--line);box-shadow:var(--sh-1);margin:0 14px 10px;overflow:hidden}
.row{display:flex;align-items:center;gap:11px;padding:13px 14px;cursor:pointer;position:relative;transition:background .2s var(--ease)}
.row:active{background:var(--card2)}
.row+.row::after{content:'';position:absolute;top:0;left:54px;right:0;height:1px;background:var(--line2)}
.row .ri{width:34px;height:34px;border-radius:var(--r-sm);background:var(--blue-l);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.row .ri.gray{background:var(--line2);color:var(--ink2)}
.row .ri.red{background:var(--danger-l);color:var(--danger)}
.row .ri.green{background:var(--ok-l);color:var(--ok)}
.row .rt{flex:1;min-width:0}
.row .rt .a{font-size:calc(var(--s)*14px);font-weight:700}
.row .rt .b{font-size:calc(var(--s)*11.5px);color:var(--sub);margin-top:2px;line-height:1.5}
.row .ch{color:#c3ccd8;display:flex}
.group{padding:16px 18px 7px;font-size:calc(var(--s)*11.5px);font-weight:800;color:var(--sub);letter-spacing:.08em;display:flex;align-items:center;gap:7px}
.group .ln{flex:1;height:1px;background:var(--line)}
.note{text-align:center;font-size:calc(var(--s)*11.5px);color:var(--sub);padding:18px 24px 26px;line-height:1.7}

/* ---------- 表单 / 其它组件 ---------- */
.bigrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px 4px}
.big{height:calc(var(--s)*76px);border:1px solid var(--line);border-radius:var(--r-lg);font-size:calc(var(--s)*14.5px);font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--card);color:var(--ink);box-shadow:var(--sh-1);transition:transform .22s var(--spring),box-shadow .22s var(--ease)}
.big:active{transform:scale(.97)}
.big.photo{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 8px 20px rgba(37,99,235,.25)}
.form-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;margin:12px 14px 0;display:none;box-shadow:var(--sh-1);animation:cardIn .3s var(--ease) both}
.form-card.show{display:block}
.form-card .ft{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.form-card .ft b{font-size:calc(var(--s)*15px)}
.aitag{background:var(--blue-l);color:var(--blue);font-size:calc(var(--s)*10.5px);font-weight:800;padding:2px 8px;border-radius:999px;display:none}
.aitag.show{display:inline-block}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:calc(var(--s)*12px);color:var(--sub);font-weight:700;margin-bottom:5px}
.fld input,.fld select{width:100%;height:calc(var(--s)*46px);border:1px solid var(--line);border-radius:var(--r-md);background:var(--card2);padding:0 12px;font-size:calc(var(--s)*14.5px);outline:none;color:var(--ink);transition:border-color .2s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease)}
.fld input:focus,.fld select:focus{border-color:var(--blue-l2);background:#fff;box-shadow:0 0 0 4px var(--blue-l)}
.fld .tip{font-size:calc(var(--s)*11px);color:var(--warn);margin-top:4px;font-weight:600}
.fldrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.okbtn{width:100%;height:calc(var(--s)*50px);border:none;border-radius:var(--r-md);background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;font-size:calc(var(--s)*15.5px);font-weight:800;letter-spacing:1px;box-shadow:0 8px 20px rgba(37,99,235,.24);transition:transform .2s var(--spring),filter .2s var(--ease)}
.okbtn:active{transform:scale(.97);filter:brightness(.96)}
.rec{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px;margin-bottom:8px;box-shadow:var(--sh-1)}
.rec .ph{width:calc(var(--s)*42px);height:calc(var(--s)*42px);border-radius:var(--r-md);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:calc(var(--s)*16px);font-weight:800}
.rec .info{flex:1}.rec .n{font-size:calc(var(--s)*14px);font-weight:700}.rec .d{font-size:calc(var(--s)*11px);color:var(--sub)}.rec .q{font-size:calc(var(--s)*15px);font-weight:800;color:var(--ok)}
.sizes{display:flex;gap:8px;margin-top:8px}
.sizes button{flex:1;height:calc(var(--s)*40px);border-radius:var(--r-md);border:1px solid var(--line);background:var(--card2);font-size:calc(var(--s)*14px);font-weight:800;color:var(--ink);transition:background .2s var(--ease),color .2s var(--ease),transform .2s var(--spring)}
.sizes button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.sizes button:active{transform:scale(.97)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:13px;box-shadow:var(--sh-1)}
.stat .k{font-size:calc(var(--s)*11.5px);color:var(--sub);font-weight:600}
.stat .v{font-size:calc(var(--s)*20px);font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:999px;background:var(--line2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#60a5fa,#2563eb);animation:grow .6s var(--ease) both}
@keyframes grow{from{width:0}}
.text-sm{font-size:calc(var(--s)*12px)}.text-xs{font-size:calc(var(--s)*11px)}.text-lg{font-size:calc(var(--s)*15px)}.text-xl{font-size:calc(var(--s)*17px)}.text-2xl{font-size:calc(var(--s)*21px)}
.text-muted{color:var(--sub)}.text-green{color:var(--ok)}.text-red{color:var(--danger)}.text-blue{color:var(--blue)}.text-gold{color:var(--warn)}
.font-bold{font-weight:700}.font-bolder{font-weight:800}.text-center{text-align:center}
.mt-sm{margin-top:6px}.mt{margin-top:10px}.mb{margin-bottom:10px}.mb-sm{margin-bottom:6px}.pt{padding-top:10px}.pb{padding-bottom:10px}
.flex{display:flex}.gap{display:flex;gap:8px}.gap-sm{display:flex;gap:4px}.wrap{flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:999px;font-size:calc(var(--s)*12px);background:var(--card);border:1px solid var(--line);color:var(--ink2);font-weight:700}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:calc(var(--s)*11px);font-weight:800}
.badge-red{background:var(--danger-l);color:var(--danger)}.badge-green{background:var(--ok-l);color:var(--ok)}.badge-blue{background:var(--blue-l);color:var(--blue)}
.empty{color:var(--sub);font-size:calc(var(--s)*13px);text-align:center;padding:26px 16px;line-height:1.8}

/* ---------- 反馈：印章 / toast ---------- */
.done{position:absolute;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:20}
.done.show{display:flex;animation:pageIn .2s var(--ease) both}
.stamp{width:158px;height:158px;border:3px solid var(--blue);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--blue);background:rgba(255,255,255,.97);box-shadow:0 20px 50px rgba(16,24,40,.22);animation:stampIn .42s var(--spring) both}
.stamp.green{border-color:var(--ok);color:var(--ok)}
.stamp .a{font-size:calc(var(--s)*30px);font-weight:800;letter-spacing:2px}
.stamp .b{font-size:calc(var(--s)*12px);font-weight:700;margin-top:5px;color:var(--sub)}
@keyframes stampIn{from{transform:scale(1.45);opacity:0}to{transform:scale(1);opacity:1}}
.toast{position:absolute;left:50%;bottom:150px;transform:translate(-50%,10px);background:rgba(15,23,42,.94);color:#fff;padding:9px 16px;border-radius:999px;font-size:calc(var(--s)*12.5px);font-weight:600;opacity:0;transition:opacity .24s var(--ease),transform .34s var(--spring);pointer-events:none;z-index:30;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;box-shadow:var(--sh-2)}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* 商品卡：图片区单独一层 —— 相机按钮放图片里，不再压住下面的价格 */
.pcard .thumb{position:relative;display:block;line-height:0}
.pcard .thumb .im,.pcard .thumb .ph{width:100%;aspect-ratio:1}
.pcard .thumb .cam{position:absolute;top:4px;left:4px}
.pcard .pr .stk{font-size:calc(var(--s)*9.5px)}
/* 列表页固定顶栏：搜索/筛选永远在顶上，滚动不会划走 */
.sticky-bar{position:sticky;top:0;z-index:6;background:var(--bg);box-shadow:0 10px 14px -14px rgba(16,24,40,.5)}
/* 今日营收固定条 */
.today-fixed{padding:10px 15px 9px;background:var(--card);border-bottom:1px solid var(--line)}
.today-fixed .d{font-size:11.5px;color:var(--sub);display:flex;align-items:center;gap:6px}
.today-fixed .row3{display:flex;gap:12px;margin-top:5px}
.today-fixed .m{flex:1;min-width:0}
.today-fixed .m .k{font-size:11px;color:var(--sub)}
.today-fixed .m .v{font-size:calc(var(--s)*17px);font-weight:800;font-variant-numeric:tabular-nums;margin-top:1px}
/* 右上角登录账号（一直挂着） */
.acct-chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:4px 10px 4px 4px;font-size:11.5px;font-weight:700;color:var(--ink2);max-width:52%;transition:background .2s var(--ease),transform .2s var(--spring)}
.acct-chip:active{transform:scale(.96)}
.acct-chip .av{width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:none}
.acct-chip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-chip.warn{background:var(--warn-l);border-color:#f0dfb8;color:#8a6400}
.acct-chip.warn .av{background:var(--warn)}
/* 弹层统一入场（JS 里给 overlay 加 .sheet） */
.sheet{animation:panelUp .36s var(--spring) both}
@keyframes panelUp{from{opacity:0;transform:translate3d(0,5%,0) scale(.98)}to{opacity:1;transform:none}}
/* 无障碍：系统开了"减弱动态效果"就全部关掉 */
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
