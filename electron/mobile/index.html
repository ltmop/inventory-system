<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/m/manifest.json">
<title>阿东渔具</title>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/m/sw.js').catch(()=>{})}</script>
<style>
:root{--paper:#f7f2e8;--card:#fffdf7;--ink:#2b2620;--sub:#8a7f6e;--line:#e2d9c8;--red:#c0392b;--green:#1faa59;--blue:#1677ff;--gold:#b7791f;font-size:17px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#d8d2c4;color:var(--ink);display:flex;justify-content:center;font-size:17px}
.phone{width:100%;max-width:430px;background:var(--paper);min-height:100vh;display:flex;flex-direction:column;position:relative;box-shadow:0 0 30px rgba(0,0,0,.25)}
.sign{background:var(--card);border-bottom:3px solid var(--ink);padding:14px 16px 12px;display:flex;align-items:center;gap:12px}
.sign h1{font-family:"STKaiti","KaiTi","SimSun",serif;font-size:32px;font-weight:900;letter-spacing:2px}
.seal{margin-left:auto;width:58px;height:58px;border:3px solid var(--red);border-radius:50%;color:var(--red);display:flex;align-items:center;justify-content:center;text-align:center;font-family:"STKaiti","KaiTi",serif;font-size:14px;font-weight:900;line-height:1.1;transform:rotate(8deg);opacity:.85}
.date{font-size:12px;color:var(--sub);margin-top:3px}
.page-title{font-family:"STKaiti","KaiTi",serif;font-size:22px;font-weight:900;margin-left:auto;background:var(--ink);color:var(--paper);padding:4px 12px;border-radius:4px;font-size:13px}

.scanrow{display:flex;gap:10px;padding:14px 16px 4px}
.scanbtn{flex:1.15;height:60px;border:3px solid var(--ink);border-radius:12px;background:var(--ink);color:var(--paper);font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:3px 3px 0 rgba(43,38,32,.25);cursor:pointer}
.scanbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(43,38,32,.25)}
.search{flex:1;height:60px;border:3px solid var(--ink);border-radius:12px;background:var(--card);padding:0 14px;font-size:18px;outline:none;box-shadow:3px 3px 0 rgba(43,38,32,.25)}
.hint{font-size:13px;color:var(--sub);padding:5px 20px 0}

.sectitle{display:flex;align-items:center;gap:8px;padding:16px 18px 10px}
.sectitle .tag{background:var(--red);color:#fff;font-size:14px;font-weight:800;padding:4px 12px;border-radius:3px;transform:rotate(-2deg);box-shadow:2px 2px 0 rgba(0,0,0,.15)}
.sectitle span{font-size:13px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px 14px}
.hot{background:var(--card);border:2px solid var(--ink);border-radius:10px;overflow:hidden;position:relative;user-select:none;box-shadow:2px 2px 0 rgba(43,38,32,.2);cursor:pointer}
.hot:active{transform:scale(.96)}
.hot .ph{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:#fff}
.hot .nm{font-size:14px;font-weight:700;padding:6px 8px 0;line-height:1.25;min-height:36px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hot .pr{font-size:17px;font-weight:900;color:var(--red);padding:1px 8px 8px}
.hot .badge{position:absolute;top:6px;right:6px;min-width:24px;height:24px;border-radius:12px;background:var(--red);border:2px solid #fff;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 6px;box-shadow:0 2px 4px rgba(0,0,0,.3)}

.cart{flex:1;background:var(--card);border-top:3px solid var(--ink);padding:10px 16px 6px;overflow-y:auto}
.cart h3{font-size:14px;color:var(--sub);font-weight:700;margin-bottom:6px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.empty{color:#b8ad97;font-size:14px;text-align:center;padding:22px 0}
.line{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.line .ph{width:46px;height:46px;border-radius:8px;border:2px solid var(--ink);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:800}
.line .info{flex:1;min-width:0}
.line .info .n{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line .info .p{font-size:13px;color:var(--sub)}
.qty{display:flex;align-items:center;gap:2px}
.qty button{width:34px;height:34px;border-radius:8px;border:2px solid var(--ink);background:var(--card);font-size:18px;font-weight:800;cursor:pointer}
.qty button:active{background:var(--paper)}
.qty .n{width:30px;text-align:center;font-size:16px;font-weight:800}

.checkout{background:var(--card);border-top:3px solid var(--ink);padding:14px 16px calc(12px + env(safe-area-inset-bottom))}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.total .t{font-size:15px;color:var(--sub);font-weight:700}
.total .v{font-size:30px;font-weight:900;font-family:"STKaiti","KaiTi",serif}
.payrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pay{height:56px;border:3px solid #fff;border-radius:10px;font-size:17px;font-weight:900;color:#fff;position:relative;box-shadow:0 4px 8px rgba(0,0,0,.28);letter-spacing:1px;cursor:pointer}
.pay::before{content:'';position:absolute;top:-8px;left:50%;width:36px;height:13px;transform:translateX(-50%) rotate(-3deg);background:rgba(255,255,255,.5);border:1px solid rgba(0,0,0,.08);border-radius:2px}
.pay:active{transform:scale(.95)}
.pay.cash{background:var(--red);transform:rotate(-2deg)}
.pay.wx{background:var(--green);transform:rotate(1.5deg)}
.pay.ali{background:var(--blue);transform:rotate(-1deg)}
.pay.credit{background:#3a3a3a;transform:rotate(2deg)}

.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:3px solid var(--ink)}
.tab{padding:10px 0 calc(9px + env(safe-area-inset-bottom));text-align:center;font-size:13px;color:var(--sub);font-weight:700;cursor:pointer;text-decoration:none}
.tab svg{width:24px;height:24px;display:block;margin:0 auto 3px}
.tab.on{color:var(--red)}

.done{position:absolute;inset:0;background:rgba(43,38,32,.5);display:none;align-items:center;justify-content:center;z-index:9}
.done.show{display:flex}
.stamp{width:150px;height:150px;border:6px solid var(--red);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--red);transform:rotate(-12deg);background:rgba(255,253,247,.92);animation:stampin .25s ease-out}
.stamp.green{border-color:var(--green);color:var(--green)}
.stamp .a{font-family:"STKaiti","KaiTi",serif;font-size:34px;font-weight:900}
.stamp .b{font-size:13px;font-weight:800;margin-top:4px}
@keyframes stampin{from{transform:rotate(-12deg) scale(2);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}

.toast{position:absolute;left:50%;bottom:160px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:6px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:8;white-space:nowrap}
.toast.show{opacity:1}

.bigrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 16px 4px}
.big{height:86px;border:3px solid var(--ink);border-radius:14px;font-size:17px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:3px 3px 0 rgba(43,38,32,.25);background:var(--card);color:var(--ink);cursor:pointer}
.big:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(43,38,32,.25)}
.big.photo{background:var(--red);color:#fff;border-color:var(--red)}

.form-card{background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:14px;margin:14px 16px 0;display:none;box-shadow:4px 4px 0 rgba(43,38,32,.2)}
.form-card.show{display:block}
.form-card .ft{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.form-card .ft b{font-size:16px}
.aitag{background:var(--gold);color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:3px;transform:rotate(-2deg);display:none}
.aitag.show{display:inline-block}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:13px;color:var(--sub);font-weight:700;margin-bottom:4px}
.fld input,.fld select{width:100%;height:50px;border:2px solid var(--ink);border-radius:10px;background:#fff;padding:0 12px;font-size:16px;outline:none}
.fld .tip{font-size:12px;color:var(--gold);margin-top:4px;font-weight:700}
.fldrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.okbtn{width:100%;height:56px;border:3px solid var(--ink);border-radius:12px;background:var(--green);color:#fff;font-size:18px;font-weight:900;box-shadow:3px 3px 0 rgba(43,38,32,.3);letter-spacing:2px;cursor:pointer}
.okbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(43,38,32,.3)}

.rec{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.rec .ph{width:44px;height:44px;border-radius:8px;border:2px solid var(--ink);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:800}
.rec .info{flex:1}.rec .n{font-size:15px;font-weight:700}.rec .d{font-size:12px;color:var(--sub)}.rec .q{font-size:16px;font-weight:900;color:var(--green)}

.card{background:var(--card);border-radius:10px;padding:14px;margin:0 16px 10px;border:2px solid var(--ink);box-shadow:2px 2px 0 rgba(43,38,32,.2)}
.card .split{display:flex;justify-content:space-between;align-items:center}
.text-sm{font-size:12px}.text-xs{font-size:11px}.text-lg{font-size:16px}.text-xl{font-size:18px}.text-2xl{font-size:22px}
.text-muted{color:var(--sub)}.text-green{color:var(--green)}.text-red{color:var(--red)}.text-blue{color:var(--blue)}.text-gold{color:var(--gold)}
.font-bold{font-weight:700}.font-bolder{font-weight:900}.text-center{text-align:center}
.mt-sm{margin-top:6px}.mt{margin-top:10px}.mb{margin-bottom:10px}.mb-sm{margin-bottom:6px}.pt{padding-top:10px}.pb{padding-bottom:10px}
.flex{display:flex}.gap{display:flex;gap:8px}.gap-sm{display:flex;gap:4px}.wrap{flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;padding:6px 14px;border-radius:20px;font-size:13px;background:var(--card);border:2px solid var(--ink);color:var(--ink);font-weight:700}
.badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:800}
.badge-red{background:var(--red);color:#fff}.badge-green{background:var(--green);color:#fff}
</style>
</head>
<body>
<div class="phone">
  <div class="sign"><div><h1 id="shopName">阿东渔具</h1><div class="date" id="dateEl"></div></div><div class="seal">营业<br>中</div></div>
<div id="netBanner" style="display:none;padding:8px 14px;font-size:13px;font-weight:700;background:#fff3cd;color:#8a6d00;border-bottom:1px solid #e6c94c"></div>
<div id="app"></div>
<nav class="tabs" id="nav">
  <a class="tab on" href="#pos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2zM9 8h6M9 12h6"/></svg>开单</a>
  <a class="tab" href="#inbound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>入库</a>
  <a class="tab" href="#stock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/></svg>库存</a>
  <a class="tab" href="#today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>今日</a>
  <a class="tab" href="#more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>更多</a>
</nav>
<div class="done" id="doneStamp"><div class="stamp" id="stampEl"><div class="a" id="stampA">收讫</div><div class="b" id="stampB"></div></div></div>
<div class="toast" id="toastEl"></div>
</div>
<script src="lib/zxing.min.js"></script>
<script src="app.js"></script>
<script src="pages/pos.js"></script>
<script src="pages/inbound.js"></script>
<script src="pages/stock.js"></script>
<script src="pages/today.js"></script>
<script src="pages/expenses.js"></script>
<script src="pages/restock.js"></script>
<script src="pages/customers.js"></script>
<script src="pages/suppliers.js"></script>
<script src="pages/stocktake.js"></script>
<script src="pages/expiring.js"></script>
<script src="pages/waste.js"></script>
<script src="pages/parts.js"></script>
<script src="pages/kits.js"></script>
<script src="pages/ai.js"></script>
</body>
</html>
